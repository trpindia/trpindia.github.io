<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

   <link rel="icon" type="image/png" href="images/favicon-32x32.png">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Custom contact styles */
    .contact {
      padding: 60px 20px;
      max-width: 800px;
      margin: auto;
      text-align: center;
      font-size: 18px;
      line-height: 1.8;
    }

    .contact h2 {
      font-size: 32px;
      color: #0044cc;
      margin-bottom: 20px;
    }

    .contact p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 40px;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .contact-form button {
      padding: 12px 20px;
      font-size: 18px;
      background: #0044cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background: #002a80;
    }

    .contact-info p {
      font-size: 18px;
      margin: 10px 0;
    }

    .contact-info a {
      color: #0044cc;
      font-weight: bold;
      text-decoration: none;
    }

    .contact-info i {
      margin-right: 10px;
    }
  </style>
</head>

  <!-- Header / Navbar -->

    <nav class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="eshop/">E-Shop</a>
      <a href="eapps.html">E-Apps</a>

  <!-- Contact Section -->
  <section class="contact">
    <h2>📞 Get in Touch</h2>
    <p>Have any Help, support, ideas or suggestions? Send us your message directly!</p>

    <!-- 🔥 Direct Mail Form -->
    <form class="contact-form" action="mailto:trpelectronics.in@gmail.com" method="POST" enctype="text/plain">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="6" placeholder="Your Idea / Message" required></textarea>
      <button type="submit">Send Email</button>
    </form>
    <! -----  LINK BOX -----  >
<div class="contact-links-container">
  <a href="mailto:trpelectronics.in@gmail.com" class="social-btn email-btn" target="_blank">
    <i class="fa-solid fa-envelope btn-icon"></i>
    <span class="btn-text">Email</span>
  </a>

  <a href="https://wa.me/919115603213" class="social-btn whatsapp-btn" target="_blank">

  <a href="https://instagram.com/trpelectronics.in" class="social-btn instagram-btn" target="_blank">

  </a>
</div>
