<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart - TRP Electronics</title>
   <link rel="icon" type="image/png" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cart.css" />
</head>
<body class="cart-page">

  <!-- Header / Navbar -->
  <header>
    <a href="cart.html" id="logo">TRP Electronics</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="eshop/" class="active">E-Shop</a></li>
        <li><a href="eapps.html">E-Apps</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="menu-icon" id="menuToggle">☰</div>

    <nav class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="eshop/">E-Shop</a>
      <a href="eapps.html">E-Apps</a>
      <a href="contact.html">Contact</a>
      <!-- Mobile Drawer ke andar Dark Mode Button -->
      <button id="mobileDarkModeToggle" class="mobile-dark-btn">🌙 Dark Mode</button>
    </nav>
  </header>

  <main class="cart-main">
              <div style="text-align:center;">
        <p id="freeNotice" class="notice-line">
          Order above ₹699 to get FREE DELIVERY!
        </p>
      </div>

    <div class="cart-container">
      <!-- LEFT: cart items list (70%) -->
      <div class="cart-items">
        <h2>Your Cart</h2>
        <div id="cart-items-list">
          <!-- JS will populate cart items here -->
        </div>

        <!-- Address form is below cart items (user chose Y) -->
        <section class="address-section">
          <h3>Delivery Details</h3>
          <div class="address-form">
            <input id="name" type="text" placeholder="Full Name" required />
            <input id="address" type="text" placeholder="Full Address" required />
            <input id="pincode" type="text" placeholder="Pincode" required />
            <input 
              id="phone"
              type="tel"
              name="phone"
              placeholder="Enter 10-digit mobile Number"
              maxlength="10"
              required >
          </div>
        </section>
      </div>

      <!-- RIGHT: order summary (30%) -->
      <aside class="order-summary">
        <div class="summary-box">
          <h3>Order Summary</h3>
          <p id="summary-subtotal">Subtotal: ₹0</p>
          <p id="summary-delivery">Delivery: ₹0</p>
          <hr />
          <p id="summary-total" class="total-amount">Total: ₹0</p>

          <button id="orderNow" class="primary-btn">Proceed to Pay</button>
          <a href="eshop/" class="secondary-btn" id="backToShop">← Back to Shop</a>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <p>© 2025 TRP Electronics | Made with ❤️</p>
  </footer>

  <button id="darkModeToggle">🌙 Dark Mode</button>

  <script src="script.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <div id="menuOverlay" class="menu-overlay"></div>
</body>
</html>
